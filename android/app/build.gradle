apply plugin: 'com.android.application'

// ILOVA VERSIYASI — BITTA JOYDA.
// Bu yerdan uch narsa oladi: Android versionCode, versionName va APK fayl nomi.
// Yangi yangilanish chiqarganda faqat shu ikki qatorni o'zgartiring.
def omVersiya = "12"          // "Oliy maqsad v12.apk" va Sozlamalardagi versiya
def omVersiyaKodi = 12        // Android uchun: har chiqarishda OSHIB borishi shart

// IMZO KALITI. Yo'l va parollar `android/keystore.properties` da turadi —
// u fayl .gitignore da, GitHub'ga TUSHMAYDI. Kalitning o'zi esa umuman
// loyihadan tashqarida: C:\Users\Techno House\oliy-maqsad-kalit\
// Fayl topilmasa (masalan toza klondan qurilsa) release imzosiz chiqadi,
// ammo qurilish to'xtamaydi.
def kalitFayl = rootProject.file("keystore.properties")
def kalit = new Properties()
if (kalitFayl.exists()) { kalitFayl.withInputStream { kalit.load(it) } }
def kalitBor = kalit.containsKey("storeFile")

android {
    namespace = "com.oliymaqsad.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.oliymaqsad.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode omVersiyaKodi
        versionName omVersiya
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (kalitBor) {
                storeFile file(kalit["storeFile"])
                storePassword kalit["storePassword"]
                keyAlias kalit["keyAlias"]
                keyPassword kalit["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            if (kalitBor) { signingConfig signingConfigs.release }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // APK FAYL NOMI AVTOMATIK: "Oliy maqsad v11.apk"
    // Avval har safar `app-debug.apk` chiqib, qo'lda qayta nomlash kerak edi.
    // Debug qurilishida oxiriga " (debug)" qo'shiladi — chalkashmasin.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def qoshimcha = variant.buildType.name == 'release' ? '' : ' (' + variant.buildType.name + ')'
            outputFileName = "Oliy maqsad v" + omVersiya + qoshimcha + ".apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
